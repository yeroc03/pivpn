# /etc/duckdns-update.conf  (root:root, mode 600: it holds the tokens)

# Subdomain(s) without ".duckdns.org", comma separated, no spaces
DUCKDNS_DOMAINS=yourname
# From the top of https://www.duckdns.org after signing in
DUCKDNS_TOKEN=00000000-0000-0000-0000-000000000000

# Optional: Gotify alerts on IP change / failure / recovery.
# Use a URL the VM can reach and whose certificate it trusts.
#GOTIFY_URL=https://gotify.example.lan
#GOTIFY_TOKEN=AbCdEfGhIjKlMnO
